<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff0f5"><title>パレス練習チェック表</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#684958;background:#fff7fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0%,#ffe2ec 0,transparent 36%),#fff7fa}.wrap{max-width:680px;margin:auto;padding:24px 15px 50px}.hero{text-align:center;padding:23px 8px 15px}.eyebrow{font-size:12px;letter-spacing:.2em;color:#bd7893}.hero h1{font-size:27px;margin:8px 0;color:#a94e78}.hero p{font-size:13px;color:#b58399;margin:0}.panel{background:white;border:1px solid #f8dce7;border-radius:23px;padding:18px;box-shadow:0 8px 30px #d98aa01c;margin-top:16px}.monthbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.monthbar h2{margin:0;font-size:21px;color:#9d5274}.round{width:39px;height:39px;border:0;border-radius:50%;background:#ffedf3;color:#b05a7e;font-size:24px;cursor:pointer}.small{font-size:12px;color:#b88da0}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.heading h3{margin:0;font-size:16px;color:#a35378}.countgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.count{background:#fff2f6;border-radius:14px;text-align:center;padding:12px 2px}.count .name{font-size:12px}.count strong{display:block;font-size:23px;color:#bb6086;margin-top:3px}.count span{font-size:10px}.calendar{overflow-x:auto}.calendar table{width:100%;border-collapse:separate;border-spacing:0 7px;table-layout:fixed}.calendar th{font-size:11px;font-weight:600;color:#a77c90;padding:5px 0}.calendar th:first-child{width:47px}.calendar td{text-align:center;padding:4px 0}.calendar tbody tr{background:#fff8fa}.calendar tbody td:first-child{border-radius:12px 0 0 12px}.calendar tbody td:last-child{border-radius:0 12px 12px 0}.date{font-size:12px;font-weight:700;color:#805668}.date small{display:block;font-size:9px;font-weight:400}.sun{color:#d77689}.sat{color:#6c95b2}.check{appearance:none;-webkit-appearance:none;width:27px;height:27px;border:2px solid #f1c6d7;background:white;border-radius:9px;display:inline-grid;place-content:center;cursor:pointer;vertical-align:middle}.check:checked{background:#e98eaf;border-color:#e98eaf}.check:checked:after{content:'✓';font-weight:900;font-size:18px;color:white}.check:focus-visible{outline:3px solid #a35378;outline-offset:2px}.today{outline:2px solid #e9a0b9;outline-offset:-2px}.notice{margin-top:15px;padding:13px;border-radius:13px;background:#fff1d8;color:#856342;font-size:12px;line-height:1.7}.footer{text-align:center;color:#c39bad;font-size:12px;margin:24px 0}.pill{border:0;border-radius:99px;background:#f8e1ea;color:#a65378;padding:8px 13px;font-size:12px;cursor:pointer}button{font-family:inherit}@media(max-width:380px){.wrap{padding:15px 9px}.panel{padding:12px 9px}.calendar th:first-child{width:38px}.check{width:25px;height:25px}.countgrid{gap:4px}.count .name{font-size:11px}}
</style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">✿ PALACE PRACTICE ✿</div><h1>🌷 パレス練習チェック表</h1><p>今日の小さな一歩が、明日の自信になる ♡</p></header><section class="panel"><div class="monthbar"><button class="round" id="prev" aria-label="前月">‹</button><div style="text-align:center"><h2 id="month"></h2><div class="small">みんなでコツコツ、成長記録 ♡</div></div><button class="round" id="next" aria-label="翌月">›</button></div></section><section class="panel"><div class="heading"><h3>🏅 今月の練習回数</h3><span class="small" id="total"></span></div><div class="countgrid" id="counts"></div></section><section class="panel"><div class="heading"><h3>📅 毎日のチェック</h3><button class="pill" id="current">今月に戻る</button></div><div class="calendar"><table><thead><tr><th>日付</th><th>郁美</th><th>今井</th><th>三輪</th><th>安田</th><th>山田</th></tr></thead><tbody id="days"></tbody></table></div><div class="notice"><b>🌼 現在はデザイン確認版です</b><br>チェックはこの端末のブラウザ内にのみ保存されます。<b>他のスタッフのスマホには共有されません。</b> 全員で共有するには、次に共通の保存先を設定します。月が変わると新しい月は未チェックで始まります。</div></section><div class="footer">Made with ♡ for Palace Team</div></main><script>


const SUPABASE_URL = 'https://ossnwjrknrvtmbhdsgor.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CO046kk1NH1pHF36IO1LeQ_pFvRhBDM';

  const names=['郁美','今井','三輪','安田','山田'];const now=new Date();let year=now.getFullYear(),month=now.getMonth();const $=id=>document.getElementById(id);const key=()=>`palace-practice-preview-${year}-${month+1}`;const load=()=>{try{return JSON.parse(localStorage.getItem(key())||'{}')}catch{return {}}};function render(){const state=load();$('month').textContent=`${year}年 ${month+1}月`;const counts=names.map((_,i)=>Object.entries(state).filter(([k,v])=>k.endsWith('-'+i)&&v).length);$('counts').innerHTML=names.map((n,i)=>`<div class="count"><div class="name">${n}</div><strong>${counts[i]}</strong><span>回 ♡</span></div>`).join('');$('total').textContent=`合計 ${counts.reduce((a,b)=>a+b,0)} 回`;const num=new Date(year,month+1,0).getDate();let html='';for(let day=1;day<=num;day++){const w=new Date(year,month,day).getDay();const cls=w===0?'sun':w===6?'sat':'';const today=year===now.getFullYear()&&month===now.getMonth()&&day===now.getDate();html+=`<tr class="${today?'today':''}"><td class="date ${cls}">${day}<small>${'日月火水木金土'[w]}</small></td>${names.map((n,i)=>`<td><input class="check" type="checkbox" aria-label="${month+1}月${day}日 ${n} 練習済み" data-day="${day}" data-person="${i}" ${state[`${day}-${i}`]?'checked':''}></td>`).join('')}</tr>`}$('days').innerHTML=html;document.querySelectorAll('.check').forEach(el=>el.addEventListener('change',e=>{const data=load();data[`${e.target.dataset.day}-${e.target.dataset.person}`]=e.target.checked;try{localStorage.setItem(key(),JSON.stringify(data))}catch{alert('このブラウザでは保存できません')}render()}))}function shift(n){month+=n;if(month<0){month=11;year--}if(month>11){month=0;year++}render()}$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('current').onclick=()=>{year=now.getFullYear();month=now.getMonth();render()};render();

const api = `${SUPABASE_URL}/rest/v1/practice_checks`;
const headers = {
  apikey: SUPABASE_KEY,
  Authorization: `Bearer ${SUPABASE_KEY}`,
  "Content-Type": "application/json"
};

let sharedRows = [];
let requestNumber = 0;

render = async function () {
  const request = ++requestNumber;
  const selectedMonth = `${year}-${String(month + 1).padStart(2, "0")}`;

  $("month").textContent = `${year}年 ${month + 1}月`;
  $("days").innerHTML = '<tr><td colspan="6">読み込み中...</td></tr>';

  try {
    const response = await fetch(
      `${api}?month=eq.${selectedMonth}&select=*`,
      { headers, cache: "no-store" }
    );
    if (!response.ok) throw new Error(await response.text());

    const rows = await response.json();
    if (request !== requestNumber) return;
    sharedRows = rows;

    const counts = names.map(name =>
      rows.filter(r => r.staff === name && r.checked === true).length
    );

    $("counts").innerHTML = names.map((name, i) =>
      `<div class="count"><div class="name">${name}</div><strong>${counts[i]}</strong><span>回 ♡</span></div>`
    ).join("");

    $("total").textContent =
      `合計 ${counts.reduce((a, b) => a + b, 0)} 回`;

    const daysInMonth = new Date(year, month + 1, 0).getDate();
    let html = "";

    for (let day = 1; day <= daysInMonth; day++) {
      const weekday = new Date(year, month, day).getDay();
      const color = weekday === 0 ? "sun" : weekday === 6 ? "sat" : "";
      const today = year === now.getFullYear()
        && month === now.getMonth()
        && day === now.getDate();

      html += `<tr class="${today ? "today" : ""}">
        <td class="date ${color}">${day}
        <small>${"日月火水木金土"[weekday]}</small></td>`;

      for (const name of names) {
        const record = rows.find(r =>
          r.day === day && r.staff === name
        );
        html += `<td><input class="check" type="checkbox"
          data-day="${day}" data-staff="${name}"
          ${record?.checked === true ? "checked" : ""}></td>`;
      }
      html += "</tr>";
    }

    $("days").innerHTML = html;

    document.querySelectorAll(".check").forEach(input => {
      input.addEventListener("change", async function () {
        const day = Number(this.dataset.day);
        const staff = this.dataset.staff;
        const checked = this.checked;
        const previous = !checked;
        this.disabled = true;

        try {
          const existing = sharedRows.find(r =>
            r.day === day && r.staff === staff
          );

          let response;
          if (existing) {
            response = await fetch(`${api}?id=eq.${existing.id}`, {
              method: "PATCH",
              headers,
              body: JSON.stringify({ checked })
            });
          } else {
            response = await fetch(api, {
              method: "POST",
              headers,
              body: JSON.stringify({
                month: selectedMonth, day, staff, checked
              })
            });
          }

          if (!response.ok) throw new Error(await response.text());
          await render();
        } catch (error) {
          this.checked = previous;
          this.disabled = false;
          alert("保存できませんでした。設定を確認してください。");
          console.error(error);
        }
      });
    });

    const notice = document.querySelector(".notice");
    if (notice) {
      notice.innerHTML =
        "🌼 チェックは共通データベースに保存されます。ほかの端末ではページを開き直すと最新の記録が表示されます。";
    }
  } catch (error) {
    if (request !== requestNumber) return;
    $("days").innerHTML =
      '<tr><td colspan="6">読み込みに失敗しました</td></tr>';
    console.error(error);
  }
};

render();
</script></body></html>
